<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Méw · Shiny Wars 2026</title>
<link rel="icon" href="https://play.pokemonshowdown.com/sprites/gen5-shiny/mew.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* Catppuccin Mocha (default, dark) */
:root{
  --rosewater:#f5e0dc; --flamingo:#f2cdcd; --pink:#f5c2e7; --mauve:#cba6f7;
  --red:#f38ba8; --maroon:#eba0ac; --peach:#fab387; --yellow:#f9e2af;
  --green:#a6e3a1; --teal:#94e2d5; --sky:#89dceb; --sapphire:#74c7ec;
  --blue:#89b4fa; --lavender:#b4befe;
  --text:#cdd6f4; --subtext1:#bac2de; --subtext0:#a6adc8;
  --overlay2:#9399b2; --overlay1:#7f849c; --overlay0:#6c7086;
  --surface2:#585b70; --surface1:#45475a; --surface0:#313244;
  --base:#1e1e2e; --mantle:#181825; --crust:#11111b;
  --shadow:rgba(0,0,0,.45);
}
html[data-theme="latte"]{
  --rosewater:#dc8a78; --flamingo:#dd7878; --pink:#ea76cb; --mauve:#8839ef;
  --red:#d20f39; --maroon:#e64553; --peach:#fe640b; --yellow:#df8e1d;
  --green:#40a02b; --teal:#179299; --sky:#04a5e5; --sapphire:#209fb5;
  --blue:#1e66f5; --lavender:#7287fd;
  --text:#4c4f69; --subtext1:#5c5f77; --subtext0:#6c6f85;
  --overlay2:#7c7f93; --overlay1:#8c8fa1; --overlay0:#9ca0b0;
  --surface2:#acb0be; --surface1:#bcc0cc; --surface0:#ccd0da;
  --base:#eff1f5; --mantle:#e6e9ef; --crust:#dce0e8;
  --shadow:rgba(76,79,105,.18);
}
/* colorblind palettes */
html[data-cb="protanopia"], html[data-cb="deuteranopia"]{
  --red:#d55e00; --maroon:#d55e00; --peach:#e69f00; --yellow:#f0e442;
  --green:#56b4e9; --teal:#66ccee; --sky:#66ccee; --sapphire:#7b68ee;
  --blue:#0072b2; --mauve:#0072b2; --pink:#cc79a7; --lavender:#c5c8de; --flamingo:#e8c1a0;
}
html[data-cb="tritanopia"]{
  --red:#e64072; --maroon:#c93756; --peach:#ff8fa3; --yellow:#e8d5d5;
  --green:#00b0b0; --teal:#007a7a; --sky:#5ad0d0; --sapphire:#00a5a5;
  --blue:#006d6d; --mauve:#de3163; --pink:#8f2d56; --lavender:#c9c9c9; --flamingo:#f2a0b5;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--crust); color:var(--text);
  font-family:'Nunito',system-ui,sans-serif; font-size:15.5px; line-height:1.5;
}
a{color:var(--sapphire); text-decoration:none}
a:hover{text-decoration:underline}
h2{font-family:'Fredoka',sans-serif; font-weight:600; font-size:21px; margin:26px 22px 10px; color:var(--pink)}
.muted{color:var(--subtext0)}

/* header */
header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:10px 22px; background:var(--mantle);
  border-bottom:1px solid var(--surface0);
  position:sticky; top:0; z-index:40;
}
#teamlogo{height:58px; width:auto; object-fit:contain}
#mascot{width:52px; height:52px; image-rendering:pixelated; object-fit:contain}
.brand h1{
  font-family:'Fredoka',sans-serif; font-size:22px; font-weight:600; margin:0;
  color:var(--text); letter-spacing:.01em;
}
.brand .sub{color:var(--subtext0); font-size:13px; font-weight:700}
nav{margin-left:auto; display:flex; gap:2px; align-items:center; flex-wrap:wrap}
.navlink{
  background:none; border:none; color:var(--subtext1); cursor:pointer;
  font-family:'Nunito'; font-weight:800; font-size:14.5px;
  padding:10px 12px 8px; border-bottom:2px solid transparent;
}
.navlink:hover{color:var(--text)}
.navlink.on{color:var(--pink); border-bottom-color:var(--pink)}
.hdrctl{display:flex; gap:8px; align-items:center; margin-left:14px}
.smallbtn{
  background:var(--surface0); border:1px solid var(--surface1); color:var(--subtext1);
  border-radius:8px; padding:5px 10px; font-family:'Nunito'; font-weight:700; font-size:12.5px;
  cursor:pointer;
}
.smallbtn:hover{color:var(--text); background:var(--surface1)}
select.smallbtn{appearance:auto}

/* stat line */
#statline{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:0 26px;
  padding:16px 22px 6px; border-bottom:1px solid var(--surface0);
  background:var(--mantle);
}
.stat{padding:2px 0 10px}
.stat .k{font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--overlay1); font-weight:800}
.stat .v{font-family:'Fredoka'; font-size:22px; font-weight:600; color:var(--text)}
.stat.accent .v{color:var(--pink)}
.stat.good .v{color:var(--teal)}
#statnote{margin-left:auto; align-self:center; font-size:12.5px; color:var(--overlay1)}

/* egg benchmarks */
#eggs{padding:10px 22px 2px; display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center; font-size:13.5px}
#eggs .lbl{font-weight:800; color:var(--peach)}
#eggrate{
  width:76px; background:var(--base); border:1px solid var(--surface1); color:var(--yellow);
  font-weight:800; font-family:'Nunito'; font-size:13.5px; border-radius:6px; padding:3px 8px; text-align:center;
}
.eggv{color:var(--subtext1)} .eggv b{color:var(--yellow)}

/* layout for route view */
#routewrap{display:flex; gap:0; align-items:flex-start}
#routemain{flex:1; min-width:0}
#feed{
  width:270px; flex:none; margin:16px 22px 16px 0; padding:12px 14px;
  background:var(--mantle); border:1px solid var(--surface0); border-radius:10px;
}
#feed .feedtitle{font-family:'Fredoka'; font-weight:600; font-size:15px; color:var(--yellow); margin-bottom:6px}
.feeditem{display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px solid var(--surface0)}
.feeditem:first-of-type{border-top:none}
.feeditem img{width:38px; height:38px; image-rendering:pixelated}
.fi-sp{font-weight:800; font-size:13.5px}
.fi-m{font-size:12px; color:var(--subtext0)}
.fi-p{margin-left:auto; font-weight:800; color:var(--green); font-size:13px}

/* controls */
.controls{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding:14px 22px 4px;
}
.controls label{font-size:12.5px; font-weight:800; color:var(--overlay2)}
.tag{
  background:var(--base); border:1px solid var(--surface1); color:var(--subtext1);
  border-radius:6px; padding:5px 11px; font-size:13px; font-weight:700; cursor:pointer; user-select:none;
}
.tag:hover{border-color:var(--overlay0)}
.tag.on{background:var(--pink); border-color:var(--pink); color:var(--crust)}
input[type="search"]{
  background:var(--base); border:1px solid var(--surface1); color:var(--text);
  border-radius:8px; padding:7px 12px; font-family:'Nunito'; font-size:14px; width:250px;
}
input[type="search"]:focus{outline:none; border-color:var(--mauve)}
.count{font-size:12.5px; color:var(--overlay1); margin-left:auto; padding-right:2px}
select.tag{appearance:auto; cursor:pointer}
.tag .ci{width:15px; height:15px; image-rendering:pixelated; vertical-align:-2px; margin-right:6px}

/* route table */
#wrap{overflow-x:auto; padding:8px 22px 26px}
table{border-collapse:collapse; width:100%; font-size:13.5px}
thead th{
  text-align:left; padding:8px 10px; white-space:nowrap; cursor:pointer;
  color:var(--overlay2); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
  border-bottom:2px solid var(--surface1); position:sticky; top:0; background:var(--crust);
}
thead th:hover{color:var(--text)}
.arr{margin-left:4px; color:var(--pink)}
tbody td{padding:7px 10px; border-bottom:1px solid var(--surface0); vertical-align:top}
tbody tr:hover{background:var(--base)}
td.rank{color:var(--overlay1); font-weight:800}
td.loc{font-weight:800; white-space:nowrap}
td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
td.note{color:var(--subtext0); font-size:12.5px; max-width:230px}
td.warn{color:var(--peach); font-size:12.5px; max-width:200px}
.mon{white-space:nowrap}
.mon.gone{text-decoration:line-through; color:var(--overlay0)}
.mon.gone .pc{color:var(--overlay0)}
.pc{color:var(--overlay1); font-size:11.5px}
.st{font-weight:800; font-size:12.5px; white-space:nowrap}
.st::before{content:"●"; margin-right:5px; font-size:9px; vertical-align:1px}
.st-fresh{color:var(--green)} .st-hit{color:var(--peach)} .st-out{color:var(--red)} .st-other{color:var(--overlay2)}
.w-yes{color:var(--green); font-weight:800} .w-no{color:var(--overlay1)}

/* notices */
.notice{
  margin:16px 22px; padding:12px 16px; border:1px solid var(--surface1);
  border-left:3px solid var(--peach); border-radius:8px; background:var(--mantle);
  font-size:13.5px; color:var(--subtext1); max-width:760px;
}
.notice code{background:var(--surface0); padding:1px 5px; border-radius:4px; font-size:12.5px}

/* catches log */
#catches{padding:4px 22px 30px; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:10px}
.catch{background:var(--mantle); border:1px solid var(--surface0); border-radius:10px; padding:10px 12px}
.catch .sp{font-weight:800; color:var(--yellow)}
.catch .m{font-size:12.5px; color:var(--subtext0)}
.catch .p{font-size:13px; color:var(--green); font-weight:800; margin-top:3px}

/* ===== Pokédex ===== */
#dexview{display:none}
#dexgrid{
  padding:10px 22px 30px; display:grid;
  grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px;
}
.dcard{
  background:var(--mantle); border:1px solid var(--surface0); border-radius:10px;
  padding:10px 10px 8px; cursor:pointer; text-align:center; position:relative;
}
.dcard:hover{border-color:var(--mauve)}
.dcard img{width:68px; height:68px; image-rendering:pixelated; object-fit:contain}
.dcard .nm{font-weight:800; font-size:13.5px; margin-top:2px}
.dcard .no{position:absolute; top:7px; right:10px; font-size:11px; color:var(--overlay0); font-weight:800}
.dcard .nowild{position:absolute; top:7px; left:10px; font-size:10px; color:var(--overlay0)}
.typerow{display:flex; gap:4px; justify-content:center; margin-top:5px; flex-wrap:wrap}
.ty{
  font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
  padding:2px 7px; border-radius:5px; color:var(--crust); background:var(--overlay0);
}
.ty-Normal{background:var(--overlay2)} .ty-Fire{background:var(--peach)} .ty-Water{background:var(--blue)}
.ty-Grass{background:var(--green)} .ty-Electric{background:var(--yellow)} .ty-Ice{background:var(--sky)}
.ty-Fighting{background:var(--maroon)} .ty-Poison{background:var(--mauve)} .ty-Ground{background:var(--flamingo)}
.ty-Flying{background:var(--lavender)} .ty-Psychic{background:var(--pink)} .ty-Bug{background:var(--teal)}
.ty-Rock{background:var(--overlay1)} .ty-Ghost{background:var(--surface2); color:var(--text)}
.ty-Dragon{background:var(--sapphire)} .ty-Dark{background:var(--surface1); color:var(--text)}
.ty-Steel{background:var(--overlay0)} .ty-Fairy{background:var(--rosewater)}

/* detail overlay */
#ovl{
  position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:60;
  display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:34px 14px;
}
#ovl.open{display:flex}
#dbox{
  background:var(--base); border:1px solid var(--surface1); border-radius:14px;
  max-width:860px; width:100%; padding:20px 22px 24px; position:relative;
  box-shadow:0 14px 50px var(--shadow);
}
#dclose{
  position:absolute; top:12px; right:14px; background:var(--surface0); border:1px solid var(--surface1);
  color:var(--subtext1); border-radius:8px; padding:4px 11px; cursor:pointer; font-weight:800;
}
#dclose:hover{color:var(--text)}
.dhead{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
.dhead img{width:84px; height:84px; image-rendering:pixelated}
.dhead .big{font-family:'Fredoka'; font-size:26px; font-weight:600}
.dhead .no{color:var(--overlay1); font-weight:800; font-size:14px; margin-right:8px}
.dmeta{font-size:13px; color:var(--subtext0); margin-top:2px}
.dcols{display:flex; gap:26px; flex-wrap:wrap; margin-top:14px}
.dcol{flex:1; min-width:250px}
.dcol h3{font-family:'Fredoka'; font-weight:600; font-size:15px; color:var(--mauve); margin:12px 0 6px}
.statgrid{display:grid; grid-template-columns:44px 34px 1fr; gap:4px 8px; align-items:center; font-size:13px}
.statgrid .sk{color:var(--overlay2); font-weight:800; font-size:11.5px; text-transform:uppercase}
.statgrid .sv{font-weight:800; text-align:right; font-variant-numeric:tabular-nums}
.sbar{height:7px; border-radius:4px; background:var(--surface0); overflow:hidden}
.sbar i{display:block; height:100%; border-radius:4px}
.evorow{font-size:13.5px; padding:3px 0; border-top:1px solid var(--surface0)}
.evorow:first-of-type{border-top:none}
.evorow b{color:var(--text)}
.evorow .how{color:var(--subtext0)}
.kv{font-size:13.5px; padding:2px 0}
.kv b{display:inline-block; min-width:90px; color:var(--overlay2); font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.05em}
/* locations table inside detail */
.loctbl{width:100%; border-collapse:collapse; font-size:12.8px; margin-top:4px}
.loctbl th{
  text-align:left; color:var(--overlay2); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  padding:4px 8px; border-bottom:1px solid var(--surface1); position:static; cursor:default; background:none;
}
.loctbl td{padding:4px 8px; border-bottom:1px solid var(--surface0)}
.regionlbl{
  font-weight:800; font-size:12px; letter-spacing:.05em; text-transform:uppercase; margin:12px 0 2px;
}
.rg-Kanto{color:var(--red)} .rg-Johto{color:var(--yellow)} .rg-Hoenn{color:var(--green)}
.rg-Sinnoh{color:var(--blue)} .rg-Unova{color:var(--mauve)}
.rr{white-space:nowrap; font-variant-numeric:tabular-nums}
.hordetag{color:var(--teal); font-weight:800; font-size:11.5px; white-space:nowrap}
.seas{font-size:11.5px; color:var(--subtext0); white-space:nowrap}
.nowild-big{padding:8px 0 4px; color:var(--subtext0); font-size:14px}

footer{
  padding:18px 22px 26px; color:var(--overlay0); font-size:12.5px;
  border-top:1px solid var(--surface0); margin-top:10px;
}

@media (max-width:860px){
  #feed{display:none}
  #statnote{display:none}
  input[type="search"]{width:100%}
  .count{width:100%; margin-left:0}
}
</style>
</head>

const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
};
if (store.get("mew-theme") === "latte") document.documentElement.dataset.theme = "latte";
if (store.get("mew-cb")) document.documentElement.dataset.cb = store.get("mew-cb");
$("#themebtn").onclick = () => {
  const h = document.documentElement;
  const next = h.dataset.theme === "latte" ? "" : "latte";
  if (next) h.dataset.theme = next; else delete h.dataset.theme;
  store.set("mew-theme", next);
};
$("#cbmode").value = store.get("mew-cb") || "";
$("#cbmode").onchange = e => {
  const v = e.target.value, h = document.documentElement;
  if (v) h.dataset.cb = v; else delete h.dataset.cb;
  store.set("mew-cb", v);
};

/* ---- view switching ---- */
function showView(which){
  document.querySelectorAll(".navlink").forEach(b=>b.classList.remove("on"));
  $("#routeview").style.display = which==="dex" ? "none" : "";
  $("#dexview").style.display   = which==="dex" ? "block" : "none";
  $(which==="dex" ? "#v-dex" : "#v-route").classList.add("on");
  if (which==="dex" && !dexBuilt) buildDex();
  history.replaceState(null,"", which==="dex" ? "#dex" : "#");
}
$("#v-route").onclick = ()=>showView("route");
$("#v-dex").onclick   = ()=>showView("dex");

/* ---- CSV loading ---- */
function parseCSV(text){
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ','){ row.push(field); field = ""; }
    else if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
    else if (ch !== '\r') field += ch;
  }
  if (field !== "" || row.length){ row.push(field); rows.push(row); }
  return rows;
}
const num = v => { const n = parseFloat(String(v).replace(/[%,$]/g,"")); return isNaN(n) ? null : n; };
const pct = v => { const s = String(v); const n = num(s); if (n==null) return null; return s.includes("%") || n > 1.5 ? n/100 : n; };
const fmt = (v,d=2) => v==null ? "" : v.toLocaleString(undefined,{maximumFractionDigits:d});

const isFile = location.protocol === "file:";
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
];
async function tryFetch(url){
  const res = await fetch(url, {cache:"no-store", redirect:"follow"});
  if (!res.ok) throw new Error("HTTP " + res.status);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new Error("tab is not published as CSV");
  return text;
}
async function fetchCSV(url){
  try { return parseCSV(await tryFetch(url)); }
  catch(e){
    if (isFile){
      for (const mk of PROXIES){
        try { return parseCSV(await tryFetch(mk(url))); } catch(_){}
      }
    }
    throw e;
  }
}

function rowFromCSV(head, arr){
  const o = {};
  head.forEach((h,i)=> o[h.trim()] = (arr[i] ?? "").trim());
  o.rank = num(o.rank);
  { const h = num(o.horde); o.horde = h==null ? null : (h>=100 ? h/100 : h); }
  ["adj_pts_per_hit","ev_per_250","ev_per_hour"].forEach(k => o[k] = num(o[k]));
  ["split1","split2","split3","split4"].forEach(k => o[k] = pct(o[k]));
  return o;
}
function statusHTML(s){
  if (!s) return "";
  let cls = "st-other";
  if (/fresh/i.test(s)) cls = "st-fresh";
  else if (/out of/i.test(s)) cls = "st-out";
  else if (/hit|devalu/i.test(s)) cls = "st-hit";
  return `<span class="st ${cls}">${s}</span>`;
}
let caughtSet = new Set();   /* species already caught | their unique bonus is spent */
function monsHTML(r){
  const parts = [];
  for (let i=1;i<=4;i++){
    const m = r["mon"+i]; if (!m || m==="-") continue;
    const pc = r["split"+i];
    const gone = caughtSet.has(m.toLowerCase());
    parts.push(`<span class="mon${gone?" gone":""}"${gone?' title="Already caught | unique bonus spent"':""}>${m}${pc!=null?` <span class="pc">${Math.round(pc*100)}%</span>`:""}</span>`);
  }
  return parts.join(" · ");
}
function renderTable(){
  const rows = routeRows.filter(r => {
    if (filters.region && r.region !== filters.region) return false;
    if (filters.fresh  && !/fresh/i.test(r.status||"")) return false;
    if (filters.worth  && !/^y/i.test(r.worth||""))     return false;
    if (filters.hazard && !(r.warnings||"").trim())     return false;
    if (filters.q){
      const q = filters.q.toLowerCase();
      const hay = [r.location,r.region,r.mon1,r.mon2,r.mon3,r.mon4,r.data_notes,r.warnings].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const col = COLS.find(c => c.k === sortCol) || COLS[9];
  const key = col.sortKey || col.k;
  rows.sort((a,b)=>{
    let x = a[key], y = b[key];
    const bx = x==null || x==="", by = y==null || y==="";
    if (bx && by) return 0; if (bx) return 1; if (by) return -1;
    if (col.numeric || typeof x === "number") return (x - y) * sortDir;
    return String(x).localeCompare(String(y)) * sortDir;
  });
  $("#headrow").innerHTML = COLS.map(c =>
    `<th data-k="${c.k}">${c.label}${c.k===sortCol?`<span class="arr">${sortDir<0?"▼":"▲"}</span>`:""}</th>`).join("");
  document.querySelectorAll("#headrow th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortCol === k) sortDir *= -1;
    else { sortCol = k; sortDir = COLS.find(c=>c.k===k)?.numeric || k==="ev_per_hour" ? -1 : 1; }
    renderTable();
  });
  $("#tbody").innerHTML = rows.map(r => `<tr>
      <td class="rank">${r.rank ?? ""}</td>
      <td class="loc">${r.location||""}</td>
      <td>${r.region||""}</td>
      <td>${r.season||""}</td>
      <td>${r.time||""}</td>
      <td class="num">${r.horde==null ? "" : r.horde + "x"}</td>
      <td>${monsHTML(r)}</td>
      <td class="num">${fmt(r.adj_pts_per_hit)}</td>
      <td class="num">${fmt(r.ev_per_250)}</td>
      <td class="num">${fmt(r.ev_per_hour,3)}</td>
      <td>${statusHTML(r.status)}</td>
      <td>${/^y/i.test(r.worth||"") ? '<span class="w-yes">Yes</span>' : (r.worth ? '<span class="w-no">'+r.worth+'</span>' : "")}</td>
      <td class="note">${r.data_notes||""}</td>
      <td class="warn">${r.warnings||""}</td>
    </tr>`).join("");
  $("#count").textContent = rows.length + " spots";
}
function buildControls(){
  const regions = [...new Set(routeRows.map(r=>r.region).filter(Boolean))].sort();
  $("#regionsel").innerHTML = '<option value="">All regions</option>' +
    regions.map(r=>`<option>${r}</option>`).join("");
  $("#regionsel").onchange = e => { filters.region = e.target.value; renderTable(); };
  $("#freshonly").onclick  = e => { filters.fresh  = !filters.fresh;  e.target.classList.toggle("on"); renderTable(); };
  $("#worthonly").onclick  = e => { filters.worth  = !filters.worth;  e.target.classList.toggle("on"); renderTable(); };
  $("#hazardonly").onclick = e => { filters.hazard = !filters.hazard; e.target.classList.toggle("on"); renderTable(); };
  $("#search").oninput = e => { filters.q = e.target.value; renderTable(); };
}

/* ---- meta stats + egg benchmarks ---- */
let eggBase = { rate: null };
function renderMeta(meta){
  const g = k => meta[k] ?? "";
  $("#statline").innerHTML = `
    <div class="stat accent"><div class="k">Team points</div><div class="v">${fmt(num(g("team_points")),0)||"–"}</div></div>
    <div class="stat"><div class="k">Shinies</div><div class="v">${g("shinies_caught")||"–"}</div></div>
    <div class="stat"><div class="k">Unique species</div><div class="v">${g("unique_species")||"–"}</div></div>
    <div class="stat"><div class="k">Shiny odds</div><div class="v">1/${fmt(num(g("shiny_odds_1_in")),0)||"?"}</div></div>
    <div class="stat good"><div class="k">Season</div><div class="v">${g("season")||"–"}</div></div>
    ${g("game_time_igt")?`<div class="stat good"><div class="k">Game time</div><div class="v">${g("game_time_igt")}</div></div>`:""}
    ${g("phase")?`<div class="stat good"><div class="k">Phase</div><div class="v">${g("phase")}</div></div>`:""}
    <div id="statnote">live from the team sheet</div>`;
  eggBase.rate = num(g("eggs_per_hour")) || 600;
  const eggs = [0,1,2,3,4,5,6,7]
    .map(t => ({t, v: num(meta["egg_ev_t"+t])}))
    .filter(e => e.v != null);
  if (!eggs.length){ $("#eggs").innerHTML = ""; return; }
  $("#eggs").innerHTML = `<span class="lbl">Egg EV benchmarks at</span>
    <input id="eggrate" type="number" min="1" step="10" value="${eggBase.rate}">
    <span class="lbl">eggs/h:</span>` +
    eggs.map(e => `<span class="eggv" data-t="${e.t}" data-v="${e.v}">T${e.t} <b>${fmt(e.v,2)}</b>/h</span>`).join(" ") +
    `<span class="muted" style="font-size:12px">type your own hatch rate and the numbers rescale (your view only)</span>`;
  $("#eggrate").oninput = e => {
    const scale = (eggBase.rate && num(e.target.value)) ? num(e.target.value)/eggBase.rate : 1;
    document.querySelectorAll(".eggv[data-t]").forEach(ch => {
      ch.querySelector("b").textContent = fmt(parseFloat(ch.dataset.v)*scale, 2);
    });
  };
}

const slug = n => String(n).toLowerCase().replace(/♀/g,"f").replace(/♂/g,"m").replace(/[^a-z0-9]/g,"");
function renderFeed(rows){
  const recent = [...rows].sort((a,b)=> String(b.time_caught).localeCompare(String(a.time_caught))).slice(0,14);
  $("#feed").hidden = false;
  $("#feeditems").innerHTML = recent.length ? recent.map(c => `
    <div class="feeditem">
      <img loading="lazy" src="https://play.pokemonshowdown.com/sprites/gen5-shiny/${slug(c.species)}.png" alt="" onerror="this.style.display='none'">
      <div><div class="fi-sp">${c.species}</div>
        <div class="fi-m">${c.caught_ot || "?"} · ${c.time_caught || ""}</div></div>
      <div class="fi-p">+${fmt(num(c.points),0)}</div>
    </div>`).join("")
  : '<div class="feeditem"><div class="fi-m">Nothing yet | first catch starts the board.</div></div>';
}
function renderCatches(rows){
  $("#catchtitle").hidden = false;
  $("#catches").hidden = false;
  $("#catches").innerHTML = rows.length ? rows.map(c => `
    <div class="catch">
      <div class="sp">${c.species}</div>
      <div class="m">${c.caught_ot || "?"} · ${c.method || ""} · ${c.time_caught || ""}</div>
      <div class="m">${c.location || ""}</div>
      <div class="p">+${fmt(num(c.points),0)} pts${c.notes ? " · " + c.notes : ""}</div>
    </div>`).join("")
  : '<div class="notice">No shinies logged yet.</div>';
}

async function load(){
  const note = $("#loadnote");
  note.hidden = true;
  try{
    const [routeCSV, metaCSV, catchCSV] = await Promise.all(
      [CONFIG.route, CONFIG.meta, CONFIG.catches].map(fetchCSV));
    const head = routeCSV[0].map(h=>h.trim());
    routeRows = routeCSV.slice(1).map(r => rowFromCSV(head, r)).filter(r => r.location);
    const meta = {};
    metaCSV.slice(1).forEach(r => { if (r[0]) meta[r[0].trim()] = (r[1]??"").trim(); });
    const chead = catchCSV[0].map(h=>h.trim());
    const catches = catchCSV.slice(1).map(r => {
      const o = {}; chead.forEach((h,i)=> o[h] = (r[i]??"").trim()); return o;
    }).filter(c => c.species);
    caughtSet = new Set(catches.map(c => c.species.trim().toLowerCase()));
    renderMeta(meta);
    renderFeed(catches);
    buildControls();
    renderTable();
    renderCatches(catches);
    $("#controls").hidden = false;
    $("#wrap").hidden = false;
  } catch(e){
    note.hidden = false;
    note.innerHTML = isFile
      ? `Couldn't reach the sheet | browsers block sheet requests when the page is opened
         straight from a file. Host it (GitHub Pages works) or run
         <code>python -m http.server</code> in this folder and open <code>localhost:8000</code>.
         The Pokédex tab works fine either way.`
      : `Couldn't load the sheet data right now (<span class="muted">${e.message}</span>).
         The published links sometimes hiccup | try Refresh in a minute. The Pokédex tab still works.`;
  }
}
$("#refresh").onclick = load;
load();

const SEASON_BITS = [[1,"Spring"],[2,"Summer"],[4,"Autumn"],[8,"Winter"]];
function seasonText(mask){
  if (mask === 15) return "All year";
  return SEASON_BITS.filter(([b])=>mask&b).map(([,n])=>n).join(", ");
}
const rarName = i => i<0 ? "-" : DEX.rarities[i];
let dexBuilt = false;
const dexState = { q:"", type:"", region:"", wild:false, season:0, time:-1 };

/* a mon passes the location filters if ONE of its spawn entries satisfies
   region + season + time at once (rarity index 6/7/8 = morning/day/night; -1 = absent) */
function locMatch(m){
  const rg = dexState.region === "" ? null : +dexState.region;
  const sb = dexState.season, ti = dexState.time;
  if (rg === null && !sb && ti < 0) return true;
  return m[8].some(L =>
    (rg === null || L[0] === rg) &&
    (!sb || (L[9] & sb)) &&
    (ti < 0 || L[ti] >= 0));
}

function buildDex(){
  dexBuilt = true;
  const types = [...new Set(DEX.mons.flatMap(m=>m[2]))].sort();
  $("#dextype").innerHTML = '<option value="">Any type</option>' + types.map(t=>`<option>${t}</option>`).join("");
  $("#dexregion").innerHTML = '<option value="">Any region</option>' + DEX.regions.map((r,i)=>`<option value="${i}">${r}</option>`).join("");
  $("#dexsearch").oninput = e => { dexState.q = e.target.value.trim().toLowerCase(); renderDex(); };
  $("#dextype").onchange  = e => { dexState.type = e.target.value; renderDex(); };
  $("#dexregion").onchange= e => { dexState.region = e.target.value; renderDex(); };
  $("#dexwild").onclick   = e => { dexState.wild = !dexState.wild; e.target.classList.toggle("on"); renderDex(); };
  document.querySelectorAll("[data-season]").forEach(ch => ch.onclick = () => {
    dexState.season = +ch.dataset.season;
    document.querySelectorAll("[data-season]").forEach(c=>c.classList.toggle("on", c===ch));
    renderDex();
  });
  document.querySelectorAll("[data-time]").forEach(ch => ch.onclick = () => {
    dexState.time = +ch.dataset.time;
    document.querySelectorAll("[data-time]").forEach(c=>c.classList.toggle("on", c===ch));
    renderDex();
  });
  renderDex();
}
function renderDex(){
  const q = dexState.q;
  const out = [];
  for (const m of DEX.mons){
    const [id,name,tys] = m;
    if (q && !(name.toLowerCase().includes(q) || String(id) === q.replace(/^#/,""))) continue;
    if (dexState.type && !tys.includes(dexState.type)) continue;
    if (!locMatch(m)) continue;
    if (dexState.wild && !m[8].length) continue;
    out.push(m);
  }
  $("#dexcount").textContent = "Showing " + out.length + " of " + DEX.mons.length + " Pokémon";
  $("#dexgrid").innerHTML = out.map(m => `
    <div class="dcard" data-id="${m[0]}">
      <span class="no">#${m[0]}</span>
      ${m[8].length ? "" : '<span class="nowild" title="No wild encounter">not wild</span>'}
      <img loading="lazy" src="https://play.pokemonshowdown.com/sprites/gen5/${slug(m[1])}.png" alt="" onerror="this.style.visibility='hidden'">
      <div class="nm">${m[1]}</div>
      <div class="typerow">${m[2].map(t=>`<span class="ty ty-${t}">${t}</span>`).join("")}</div>
    </div>`).join("");
  document.querySelectorAll(".dcard").forEach(c => c.onclick = () => openDetail(+c.dataset.id));
}

const STAT_LABELS = [["HP",0],["Atk",1],["Def",2],["SpA",3],["SpD",4],["Spe",5]];
function statColor(v){
  if (v >= 120) return "var(--teal)";
  if (v >= 90)  return "var(--green)";
  if (v >= 60)  return "var(--yellow)";
  return "var(--red)";
}
function openDetail(id){
  const m = DEX.mons.find(x=>x[0]===id);
  if (!m) return;
  const [ , name, tys, stats, catchRate, eggs, evos, extra, locs] = [null, m[1], m[2], m[3], m[4], m[5], m[6], m[7], m[8]];
  const bst = stats.reduce((a,b)=>a+b,0);
  /* group locations by region */
  const byRegion = new Map();
  for (const L of locs){
    if (!byRegion.has(L[0])) byRegion.set(L[0], []);
    byRegion.get(L[0]).push(L);
  }
  const locHTML = locs.length ? [...byRegion.entries()].sort((a,b)=>a[0]-b[0]).map(([ri, list]) => {
    const rows = list.sort((a,b)=> DEX.locs[a[1]].localeCompare(DEX.locs[b[1]]) || a[2]-b[2]).map(L => {
      const [, li, mi, mn, mx, h, rm, rd, rn, sm] = L;
      return `<tr>
        <td>${DEX.locs[li]}</td>
        <td>${DEX.methods[mi]}${h ? ` <span class="hordetag">${h}x horde</span>` : ""}</td>
        <td class="rr">${mn===mx ? mn : mn+"–"+mx}</td>
        <td class="rr">${rarName(rm)}</td>
        <td class="rr">${rarName(rd)}</td>
        <td class="rr">${rarName(rn)}</td>
        <td class="seas">${seasonText(sm)}</td>
      </tr>`;
    }).join("");
    return `<div class="regionlbl rg-${DEX.regions[ri]}">${DEX.regions[ri]}</div>
      <table class="loctbl">
        <thead><tr><th>Location</th><th>Method</th><th>Lv</th><th>Morning</th><th>Day</th><th>Night</th><th>Season</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }).join("") : `<div class="nowild-big">No wild encounters | this one comes from evolution, breeding, events, or special means.</div>`;

  $("#dcontent").innerHTML = `
    <div class="dhead">
      <img src="https://play.pokemonshowdown.com/sprites/gen5/${slug(name)}.png" alt="" onerror="this.style.visibility='hidden'">
      <img src="https://play.pokemonshowdown.com/sprites/gen5-shiny/${slug(name)}.png" alt="" title="Shiny" onerror="this.style.display='none'">
      <div>
        <div><span class="no">#${m[0]}</span><span class="big">${name}</span></div>
        <div class="typerow" style="justify-content:flex-start">${tys.map(t=>`<span class="ty ty-${t}">${t}</span>`).join("")}</div>
        <div class="dmeta">${extra}</div>
      </div>
    </div>
    <div class="dcols">
      <div class="dcol">
        <h3>Base stats <span class="muted" style="font-size:12px">(BST ${bst})</span></h3>
        <div class="statgrid">
          ${STAT_LABELS.map(([lb,i])=>`
            <span class="sk">${lb}</span><span class="sv">${stats[i]}</span>
            <span class="sbar"><i style="width:${Math.min(100,stats[i]/1.6)}%;background:${statColor(stats[i])}"></i></span>`).join("")}
        </div>
        <h3>Details</h3>
        <div class="kv"><b>Catch rate</b> ${catchRate}</div>
        <div class="kv"><b>Egg groups</b> ${eggs.join(", ") || "-"}</div>
        ${evos.length ? `<h3>Evolves into</h3>` + evos.map(e=>`<div class="evorow"><b>${e[0]}</b> <span class="how">· ${e[1]}</span></div>`).join("") : ""}
      </div>
      <div class="dcol" style="flex:2; min-width:300px">
        <h3>Wild locations</h3>
        ${locHTML}
      </div>
    </div>`;
  $("#ovl").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeDetail(){ $("#ovl").classList.remove("open"); document.body.style.overflow = ""; }
$("#dclose").onclick = closeDetail;
$("#ovl").onclick = e => { if (e.target.id === "ovl") closeDetail(); };
addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

if (location.hash === "#dex") showView("dex");
</script>
